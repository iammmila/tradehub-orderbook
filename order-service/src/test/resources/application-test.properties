# turn off kafka
spring.kafka.bootstrap-servers=localhost:0
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
logging.level.org.springframework.kafka=OFF
logging.level.org.apache.kafka=OFF

# ---- stop Eureka/Discovery in tests (this is your biggest spam + stacktraces) ----
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false
spring.cloud.discovery.enabled=false

# ---- stop Spring Boot banner ----
spring.main.banner-mode=off

# ---- hide most Spring logs ----
logging.level.root=ERROR
logging.level.org.springframework=ERROR
logging.level.org.springframework.boot=ERROR
logging.level.org.springframework.test=ERROR

# ---- hide Eureka/Netflix logs ----
logging.level.com.netflix=OFF
logging.level.org.springframework.cloud.netflix=OFF

# ---- hide Hibernate SQL completely ----
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate=ERROR

# ---- optional: if you don't want that open-in-view warning ----
spring.jpa.open-in-view=false