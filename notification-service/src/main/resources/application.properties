spring.application.name=notification-service
server.port=8090

app.jwt.secret=263ccbebb6b753af6cbfc59af437dc46
app.auth.base-url=http://localhost:8080

# --- DB ---
spring.datasource.url=jdbc:postgresql://localhost:5432/notification_db
spring.datasource.username=postgres
spring.datasource.password=Malahat.2002
spring.datasource.driver-class-name=org.postgresql.Driver


eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
logging.level.org.apache.kafka=ERROR
logging.level.org.springframework.kafka=ERROR

# Flyway should own schema changes
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Kafka ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Topics (adjust to your actual topic names)
# topic name (match trade-service producer topic)
app.kafka.topics.order-events=orders.events
app.kafka.topics.trade-events=trades.events

app.ws.allowed-origins=http://localhost:3000